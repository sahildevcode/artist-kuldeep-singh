          var v = document.querySelector('meta[name="viewport"]');
          if (!v) {
            v = document.createElement('meta');
            v.name = 'viewport';
            document.head.appendChild(v);
          }
          v.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');

        enforceMobileViewport();
        window.addEventListener('resize', enforceMobileViewport);
